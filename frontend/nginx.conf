server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Health check used by Runpod load balancing endpoints
  location = /ping {
    default_type text/plain;
    return 200 "ok";
  }

  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
