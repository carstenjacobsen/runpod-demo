<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release Notes</title>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f6f8fa;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --code-bg: #eaeef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --sidebar-bg: #161b22;
        --text: #e6edf3;
        --muted: #8d96a0;
        --border: #30363d;
        --accent: #4493f8;
        --code-bg: #262c36;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px;
      height: 56px; padding: 0 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    header .badge {
      font-size: 12px; font-weight: 500; color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px;
    }
    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      max-width: 1200px; margin: 0 auto;
    }
    nav {
      position: sticky; top: 56px; align-self: start;
      height: calc(100vh - 56px); overflow-y: auto;
      padding: 24px 16px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
    }
    nav h2 {
      margin: 0 0 8px 8px; font-size: 12px; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
    }
    nav a {
      display: block; padding: 4px 8px; border-radius: 6px;
      color: var(--text); text-decoration: none; font-size: 14px;
    }
    nav a:hover { background: var(--code-bg); color: var(--accent); }
    nav a small { display: block; color: var(--muted); font-size: 12px; }
    main { padding: 40px 48px 80px; max-width: 820px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .lead { margin: 0 0 32px; color: var(--muted); }
    article {
      padding: 24px 0; border-top: 1px solid var(--border);
      scroll-margin-top: 72px;
    }
    article h2 { margin: 0 0 8px; font-size: 1.35rem; }
    article h2 a { color: inherit; text-decoration: none; }
    article h2 a:hover::after { content: " #"; color: var(--muted); }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 20px;
      margin: 0 0 12px; padding: 0; list-style: none;
      font-size: 14px; color: var(--muted);
    }
    .meta strong { color: var(--text); font-weight: 600; }
    code, .repo {
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--code-bg); border-radius: 6px; padding: 2px 6px;
    }
    article p { margin: 0; white-space: pre-line; }
    .status { padding: 24px 0; color: var(--muted); }
    .error {
      border: 1px solid #cf222e; border-left-width: 4px; border-radius: 6px;
      padding: 12px 16px; color: var(--text);
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      nav { display: none; }
      main { padding: 24px 16px 64px; }
    }
  </style>
</head>
<body>
  <header>
    Docs <span class="badge">Release Notes</span>
  </header>
  <div class="layout">
    <nav aria-label="Releases">
      <h2>Releases</h2>
      <div id="toc"></div>
    </nav>
    <main>
      <h1>Release Notes</h1>
      <p class="lead">Latest releases across all repositories.</p>
      <div id="content" class="status">Loading release notes…</div>
    </main>
  </div>

  <script src="config.js"></script>
  <script>
    const API_URL = window.APP_CONFIG?.API_URL || "http://localhost:8100/api/releases";
    const content = document.getElementById("content");
    const toc = document.getElementById("toc");

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else node.setAttribute(k, v);
      }
      node.append(...children);
      return node;
    }

    function formatDate(value) {
      const d = new Date(value);
      return isNaN(d) ? String(value ?? "—") : d.toLocaleDateString(undefined, {
        year: "numeric", month: "long", day: "numeric"
      });
    }

    function render(releases) {
      content.className = "";
      content.replaceChildren();
      toc.replaceChildren();

      if (!releases.length) {
        content.className = "status";
        content.textContent = "No release notes yet.";
        return;
      }

      releases
        .slice()
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .forEach((r, i) => {
          const id = `release-${i}`;
          const title = `${r.repo ?? "Unknown repo"} — ${formatDate(r.date)}`;

          content.append(
            el("article", { id },
              el("h2", {}, el("a", { href: `#${id}` }, r.repo ?? "Unknown repo")),
              el("ul", { class: "meta" },
                el("li", {}, "Date: ", el("strong", {}, formatDate(r.date))),
                el("li", {}, "Owner: ", el("strong", {}, r.owner ?? "—")),
                el("li", {}, "Repo: ", el("span", { class: "repo" }, r.repo ?? "—"))
              ),
              el("p", {}, r.summary ?? "")
            )
          );

          const link = el("a", { href: `#${id}` }, r.repo ?? "Unknown repo",
            el("small", {}, formatDate(r.date)));
          link.title = title;
          toc.append(link);
        });
    }

    async function load() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(Array.isArray(data) ? data : data.releases ?? []);
      } catch (err) {
        content.className = "error";
        content.textContent = `Could not load release notes from ${API_URL} (${err.message}).`;
      }
    }

    load();
  </script>
</body>
</html>
